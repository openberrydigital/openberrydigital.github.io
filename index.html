<!DOCTYPE html>
<html>

<head>
    <title>OpenBerry Digital - firsttestpage</title>
</head>

<body>
    <div style="text-align: center">
        <a href="/testpage1/">
            <button>Go to Test Page</button>
        </a>
    </div>

    <style>
        search {
            display: flex;
            width: 500px;
            margin: 20px auto;
        }

        #searchBox {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #888;
            border-right: none;
            border-radius: 5px 0 0 5px;
            outline: none;
        }

        #searchBox:focus {
            border-color: #222;
            background: #eee;
        }

        search button {
            padding: 10px 18px;
            border: 2px solid #888;
            border-radius: 0 5px 5px 0;
            background: #ddd;
            cursor: pointer;
        }

        search button:hover {
            background: #ddd;
        }

        .divrow {
            border: 2px solid #d5d5d5;
            border-radius: 10px;
            padding: 4px;
            background-color: #e9e9e9;
            max-width: 500px;
            margin: 8px auto;
        }

        .divrowtext {
            font-family: Segoe UI;
            font-size: 20px;
            margin: 4px 10px;
        }

        .divrowsubtext {
            font-family: Segoe UI;
            font-size: 15px;
            margin: 4px 10px;
        }
    </style>

    <search>
        <input type="search" id="searchBox" placeholder="Search...">
        <button type="button" onclick="search()">Search</button>
    </search>

    <div class="divrow">

        <p class="divrowtext">Apple</p>

        <div style="height: 2px;"></div>

        <!-- tags paragraph -->
        <p class="divrowsubtext" style="margin: 5px 20px">
            <span style="font-size">Tags:</span> <span>Tag-1, Tag-2, Tag-3</span>
        </p>

        <div style="height: 10px;"></div>

        <div
            style="background-color: #bababa; display: block; margin: 4px 6px; outline: 3px solid #bababa; border-radius: 50px">
            <audio controls style="display: block; min-width: 488px; text-align: center">
                <source src="/1000hzbeep.wav">
            </audio>
        </div>

    </div>

    <script>
        function search() {
    let searchBox = document.getElementById("searchBox");
    let searchText = searchBox.value.toLowerCase();

    let keywords = document.getElementsByClassName("divrow");

    for (let i = 0; i < keywords.length; i++) {
        let keywordText = keywords[i].textContent.toLowerCase();

        if (keywordText.includes(searchText)) {
            keywords[i].style.display = "block";
        } else {
            keywords[i].style.display = "none";
        }
    }
}

document.getElementById("searchBox").addEventListener("input", search);
    </script>
</body>
