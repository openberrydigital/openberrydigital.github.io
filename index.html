<!DOCTYPE html>
<html>

<body>

    <head>
        <title>OpenBerry Digital - firsttestpage</title>
    </head>

    <div style="text-align: center">
        <a href="/testpage1/">
            <button>Go to Test Page</button>
        </a>
    </div>

    <style>
        search {
            display: flex;
            width: 500px;
            margin: 20px auto;
        }

        #searchBox {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #888;
            border-right: none;
            border-radius: 5px 0 0 5px;
            outline: none;
        }

        #searchBox:focus {
            border-color: #222;
            background: #eee;
        }

        search button {
            padding: 10px 18px;
            border: 2px solid #888;
            border-radius: 0 5px 5px 0;
            background: #ddd;
            cursor: pointer;
        }

        search button:hover {
            background: #ddd
        }

        .divrow {
            border: 2px solid #d5d5d5;
            border-radius: 10px;
            padding: 4px;
            background-color: #e9e9e9;
            max-width: 500px;
            margin: 8px auto
        }

        .divrowtext {
            font-family: Segoe UI;
            font-size: 20px;
            margin: 4px 10px;
        }

        .divrowsubtext {
            font-family: Segoe UI;
            font-size: 15px;
            margin: 4px 10px;
        }

        .audiooutline {
            background-color: #bababa;
            display: block;
            margin: 4px 6px;
            outline: 3px solid #bababa;
            border-radius: 50px
        }

        .background {
            z-index: -1;
            border: 2px solid #bababa;
            border-radius: 10px;
            padding: 4px;
            background-color: #ffffff;
            margin: 8px auto;
            width: fit-content;
            text-align: center;
            min-width: 600px
        }

        .bodybackground {
            background-repeat: repeat;
            background-attachment: fixed;
        }
    </style>

    <button onclick="changeMode('lightmode-colormode')">
    Light Mode + Color
</button>

<button onclick="changeMode('darkmode-colormode')">
    Dark Mode + Color
</button>

<button onclick="changeMode('lightmode-noncolormode')">
    Light Mode + Non-Color
</button>

<button onclick="changeMode('darkmode-noncolormode')">
    Dark Mode + Non-Color
</button>

    <div class="background">

        <search>
            <input type="search" id="searchBox" placeholder="Search...">
            <button type="button" onclick="search()">Search</button>
        </search>

        <!-- divrow -->
        <div class="divrow">

            <p class="divrowtext" style="text-align: left">Apple</p>

            <div style="height: 2px;"></div>

            <!-- tags paragraph -->
            <p class="divrowsubtext" style="margin: 5px 20px; text-align: left">
                <span style="font-size: 15px">Tags:</span>&emsp;<span style="font-size: 12px">Green, Red, Yellow, Brown</span>
            </p>

            <div style="height: 10px;"></div>

            <div class="audiooutline">
                <audio controls="" style="display: block; min-width: 488px; text-align: center">
                    <source src="/1000hzbeep.wav">
                </audio>
            </div>

        </div>
        <!-- divrow -->

        <!-- divrow -->
        <div class="divrow">

            <p class="divrowtext" style="text-align: left">Banana</p>

            <div style="height: 2px;"></div>

            <!-- tags paragraph -->
            <p class="divrowsubtext" style="margin: 5px 20px; text-align: left">
                <span style="font-size: 15px">Tags:</span>&emsp;<span style="font-size: 12px">Yellow, Brown </span>
            </p>

            <div style="height: 10px;"></div>

            <div class="audiooutline">
                <audio controls="" style="display: block; min-width: 488px; text-align: center">
                    <source src="/1000hzbeep.wav">
                </audio>
            </div>

        </div>
        <!-- divrow -->

    </div>

    <script>
        function search() {
    let searchBox = document.getElementById("searchBox");
    let searchText = searchBox.value.toLowerCase();

    let keywords = document.getElementsByClassName("divrow");

    for (let i = 0; i < keywords.length; i++) {
        let keywordText = keywords[i].textContent.toLowerCase();

        if (keywordText.includes(searchText)) {
            keywords[i].style.display = "block";
        } else {
            keywords[i].style.display = "none";
        }
    }
}

document.getElementById("searchBox").addEventListener("input", search);
    </script>

    <script>
        const backgrounds = {
    "lightmode-colormode": "sitebgimages/site_background_lightmode_colormode.png",
    "darkmode-colormode": "sitebgimages/site_background_darkmode_colormode.png",
    "lightmode-noncolormode": "sitebgimages/site_background_lightmode_noncolormode.png",
    "darkmode-noncolormode": "sitebgimages/site_background_darkmode_noncolormode.png"
};

function changeMode(mode) {
    localStorage.setItem("siteMode", mode);

    document.body.style.backgroundImage =
        `url("${backgrounds[mode]}")`;
}

// Load the user's saved preference
const savedMode =
    localStorage.getItem("siteMode") || "lightmode-colormode";

changeMode(savedMode);
    </script>

</body>

</html>
