    <style>
        .keyword {
            max-width: 500px;
            margin: 8px auto;
        }

        search {
            display: flex;
            width: 500px;
            margin: 20px auto;
        }

        #searchBox {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #888;
            border-right: none;
            border-radius: 5px 0 0 5px;
            outline: none;
        }

        #searchBox:focus {
            border-color: #222;
            background: #eee;
        }

        search button {
            padding: 10px 18px;
            border: 2px solid #888;
            border-radius: 0 5px 5px 0;
            background: #ddd;
            cursor: pointer;
        }

        search button:hover {
            background: #ddd;
        }
    </style>
    <search>
        <input type="search" id="searchBox" placeholder="Search...">
        <button type="button" onclick="search()">Search</button>
    </search>

    <div class="keyword" style="border: 2px solid #bababa; border-radius: 4px; padding: 4px; background-color: #e9e9e9">
        <p style="font-family: Arial; margin: 5px">Apple</p>
    </div>

    <div class="keyword" style="border: 2px solid #bababa; border-radius: 4px; padding: 4px; background-color: #e9e9e9">
        <p style="font-family: Arial; margin: 5px">Banana</p>
    </div>

    <div class="keyword" style="border: 2px solid #bababa; border-radius: 4px; padding: 4px; background-color: #e9e9e9">
        <p style="font-family: Arial; margin: 5px">Crocodile</p>
    </div>

    <script>
        function search() {
    let searchBox = document.getElementById("searchBox");
    let searchText = searchBox.value.toLowerCase();

    let keywords = document.getElementsByClassName("keyword");

    for (let i = 0; i < keywords.length; i++) {
        let keywordText = keywords[i].textContent.toLowerCase();

        if (keywordText.includes(searchText)) {
            keywords[i].style.display = "block";
        } else {
            keywords[i].style.display = "none";
        }
    }
}

document.getElementById("searchBox").addEventListener("input", search);
    </script>
